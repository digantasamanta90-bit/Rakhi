<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>For Anwesha, From Your Brother | Happy Raksha Bandhan 🧿</title>
  <meta name="description" content="A personalized interactive Rakhi gift experience for Anwesha from Diganta." />
  <meta name="theme-color" content="#120810" />

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Design System Stylesheets -->
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/typography.css" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />
  <link rel="stylesheet" href="src/styles/scenes.css" />
</head>
<body>
  <div id="app-container">
    <!-- Ambient Particle Canvas Background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Transition Flare Light Overlay -->
    <div id="screen-flare" class="screen-flare" aria-hidden="true"></div>

    <!-- Persistent Global Header Navigation / Controls -->
    <header class="global-header">
      <div class="header-left">
        <!-- Subtle Progress Bar Indicator -->
        <nav class="scene-progress-bar" id="progress-bar" aria-label="Experience progress"></nav>
      </div>
      <div class="header-right">
        <!-- Persistent Music Toggle Button -->
        <button id="music-toggle" class="music-toggle-btn" aria-label="Toggle ambient soundtrack">
          <div class="music-waveform" aria-hidden="true">
            <span class="waveform-bar"></span>
            <span class="waveform-bar"></span>
            <span class="waveform-bar"></span>
            <span class="waveform-bar"></span>
          </div>
        </button>
      </div>
    </header>

    <!-- Main Scene Viewport Shell (Scenes 1 through 7) -->
    <main id="scene-viewport">
      <section id="scene-01" class="scene-container" aria-label="Scene 1: The Invitation"></section>
      <section id="scene-02" class="scene-container" aria-label="Scene 2: The Grand Rakhi Reveal"></section>
      <section id="scene-03" class="scene-container" aria-label="Scene 3: Why Is There a Website?"></section>
      <section id="scene-04" class="scene-container" aria-label="Scene 4: The Gift"></section>
      <section id="scene-05" class="scene-container" aria-label="Scene 5: The Actual Rakhi Message"></section>
      <section id="scene-06" class="scene-container" aria-label="Scene 6: The Sibling Zone"></section>
      <section id="scene-07" class="scene-container" aria-label="Scene 7: The Finale"></section>
    </main>

    <!-- Achievement Toast Notification -->
    <div id="achievement-toast" class="achievement-toast" role="status" aria-live="polite">
      <span id="toast-icon" class="achievement-icon">🏆</span>
      <div>
        <div id="toast-title" class="achievement-title">ACHIEVEMENT UNLOCKED</div>
        <div id="toast-desc" class="achievement-desc">Best Sister Detected</div>
      </div>
    </div>
  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
