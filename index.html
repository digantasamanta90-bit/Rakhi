<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>For Anwesha, From Your Brother 🧿</title>
  <meta name="description" content="A personalized interactive Rakhi gift experience for Anwesha from Diganta." />
  <meta name="theme-color" content="#0A0709" />

  <!-- Google Fonts: Fraunces, Manrope, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- GSAP 3 from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Design System -->
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/typography.css" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />
  <link rel="stylesheet" href="src/styles/cinematic.css" />
</head>
<body>
  <!-- Global Shared SVG Defs -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
    <defs>
      <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B7474D" />
        <stop offset="50%" stop-color="#D4B06A" />
        <stop offset="100%" stop-color="#B7474D" />
      </linearGradient>
    </defs>
  </svg>

  <div id="app-container">
    <!-- Film Grain Overlay -->
    <div class="film-grain" aria-hidden="true"></div>

    <!-- Ambient Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Transition Flare / Bloom -->
    <div id="screen-flare" class="screen-flare" aria-hidden="true"></div>

    <!-- Master Scene Stage -->
    <main id="scene-stage"></main>

    <!-- Top-Left Dedicated Pause / Play Control -->
    <div class="cinema-viewport-ctrl cinema-top-left">
      <button id="pause-btn" class="cinema-control-btn cinema-pause-btn" aria-label="Start film" title="Start film">
        <svg class="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:block;margin-left:2px;">
          <polygon points="7 4 19 12 7 20 7 4"></polygon>
        </svg>
      </button>
    </div>

    <!-- Top-Right Sound Control -->
    <div class="cinema-viewport-ctrl cinema-top-right">
      <button id="audio-toggle" class="cinema-control-btn audio-toggle" aria-label="Toggle sound" title="Toggle sound">
        <svg class="audio-icon-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg class="audio-icon-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </div>

    <!-- Bottom-Left Menu / Scene Navigator -->
    <div id="debug-nav" class="cinema-viewport-ctrl cinema-bottom-left debug-nav">
      <button id="debug-toggle" class="cinema-control-btn debug-toggle" aria-label="Toggle scene menu" title="Scene menu">☰</button>
      <div id="debug-panel" class="debug-panel" style="display:none;">
        <div class="debug-title">SCENE NAVIGATOR</div>
        <div id="debug-scene-list" class="debug-scene-list"></div>
        <button id="debug-restart" class="debug-btn">↻ Restart Film</button>
      </div>
    </div>

    <!-- Bottom-Right Navigation Controls (Previous / Next) -->
    <div class="cinema-viewport-ctrl cinema-bottom-right">
      <nav id="cinema-nav" class="cinema-nav-group" aria-label="Scene navigation">
        <button id="nav-btn-prev" class="cinema-control-btn cinema-nav-btn prev" aria-label="Previous scene" title="Previous scene">
          <span aria-hidden="true">‹</span>
        </button>
        <button id="nav-btn-next" class="cinema-control-btn cinema-nav-btn next" aria-label="Next scene" title="Next scene">
          <span aria-hidden="true">›</span>
        </button>
      </nav>
    </div>

    <!-- Achievement Notification Toast -->
    <div id="achievement-toast" class="achievement-toast" role="status" aria-live="polite">
      <div class="toast-badge-icon" id="toast-icon">✨</div>
      <div class="toast-text-group">
        <div id="toast-title" class="achievement-title">NOTE UNLOCKED</div>
        <div id="toast-desc" class="achievement-desc">Best Sister Detected</div>
      </div>
    </div>
  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
