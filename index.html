<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>For Anwesha, From Your Brother 🧿</title>
  <meta name="description" content="A personalized interactive Rakhi gift experience for Anwesha from Diganta." />
  <meta name="theme-color" content="#FAF6F0" />

  <!-- Google Fonts Preconnect & Import: Fraunces & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free for clean UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Design System Stylesheets -->
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/typography.css" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />
  <link rel="stylesheet" href="src/styles/scenes.css" />
</head>
<body>
  <div id="app-container">
    <!-- Paper Texture & Soft Lighting Overlay -->
    <div class="paper-texture-overlay" aria-hidden="true"></div>

    <!-- Ambient Particle Canvas Background (Gentle Dust Motes & Soft Petals) -->
    <canvas id="particle-canvas"></canvas>

    <!-- Transition Flare Light Overlay -->
    <div id="screen-flare" class="screen-flare" aria-hidden="true"></div>

    <!-- Persistent Global Header Navigation / Controls -->
    <header class="global-header">
      <div class="header-left">
        <!-- Subtle Minimal Progress Bar -->
        <nav class="scene-progress-bar" id="progress-bar" aria-label="Experience progress"></nav>
        <div class="header-nav-arrows">
          <button id="nav-prev" class="nav-arrow-btn" aria-label="Previous Scene" disabled>
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button id="nav-next" class="nav-arrow-btn" aria-label="Next Scene">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="header-right">
        <!-- Persistent Music Toggle Button (Minimal Paper Disc) -->
        <button id="music-toggle" class="music-toggle-btn" aria-label="Toggle ambient soundtrack">
          <i class="fa-solid fa-music music-note-icon" aria-hidden="true"></i>
          <div class="music-waveform" aria-hidden="true">
            <span class="waveform-bar"></span>
            <span class="waveform-bar"></span>
            <span class="waveform-bar"></span>
          </div>
        </button>
      </div>
    </header>

    <!-- Main Scene Viewport Shell (Scenes 1 through 7) -->
    <main id="scene-viewport">
      <section id="scene-01" class="scene-container" aria-label="Scene 1: The Invitation"></section>
      <section id="scene-02" class="scene-container" aria-label="Scene 2: The Grand Rakhi Reveal"></section>
      <section id="scene-03" class="scene-container" aria-label="Scene 3: Why Is There a Website?"></section>
      <section id="scene-04" class="scene-container" aria-label="Scene 4: The Gift"></section>
      <section id="scene-05" class="scene-container" aria-label="Scene 5: The Actual Rakhi Message"></section>
      <section id="scene-06" class="scene-container" aria-label="Scene 6: The Sibling Zone"></section>
      <section id="scene-07" class="scene-container" aria-label="Scene 7: The Finale"></section>
    </main>

    <!-- Achievement Toast Notification (Delicate Personal Badge) -->
    <div id="achievement-toast" class="achievement-toast" role="status" aria-live="polite">
      <div class="toast-badge-icon" id="toast-icon">✨</div>
      <div class="toast-text-group">
        <div id="toast-title" class="achievement-title">NOTE UNLOCKED</div>
        <div id="toast-desc" class="achievement-desc">Best Sister Detected</div>
      </div>
    </div>
  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
